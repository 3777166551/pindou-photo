name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: CIEDE2000 reference test (Sharma 2005, 34 pairs)
        run: |
          mkdir -p qa/out
          javac -sourcepath app/src/main/java -d qa/out qa/TestColorMath.java
          java -cp qa/out TestColorMath

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build debug APK (compile check)
        run: gradle -p . assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PindouPhoto-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  emulator-smoke:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 40
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android-avd
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: PindouPhoto-debug
          path: apk

      - name: Install emulator and system image
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "emulator" \
            "system-images;android-30;google_apis;x86_64" > /dev/null
          echo no | avdmanager create avd -n smoke \
            -k "system-images;android-30;google_apis;x86_64" --device pixel_4
          ls -la "$ANDROID_AVD_HOME"

      - name: Start headless emulator
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          if [ -e /dev/kvm ]; then ACCEL="-accel on"; echo "KVM available"; else ACCEL="-no-accel"; echo "KVM missing, software emulation"; fi
          emulator -avd smoke -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect $ACCEL -camera-back none -camera-front none &
          for i in $(seq 1 120); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then echo "boot completed after ${i}0s"; break; fi
            sleep 10
          done
          [ "$BOOT" = "1" ] || { echo "emulator boot timeout"; exit 1; }

      - name: Smoke test
        run: |
          adb wait-for-device
          adb install -r apk/*.apk
          # 关动画,避免时序抖动
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          tap_text() {
            adb shell uiautomator dump /sdcard/ui.xml > /dev/null
            adb pull /sdcard/ui.xml ui.xml > /dev/null
            B=$(grep -o "text=\"$1\"[^>]*bounds=\"\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]\"" ui.xml \
              | grep -o '\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]' | head -1)
            if [ -z "$B" ]; then echo "text not found: $1"; exit 1; fi
            X1=$(echo "$B" | sed 's/\[\([0-9]*\),.*/\1/')
            Y1=$(echo "$B" | sed 's/\[[0-9]*,\([0-9]*\)\].*/\1/')
            X2=$(echo "$B" | sed 's/.*\]\[\([0-9]*\),.*/\1/')
            Y2=$(echo "$B" | sed 's/.*,\([0-9]*\)\].*/\1/')
            adb shell input tap $(( (X1 + X2) / 2 )) $(( (Y1 + Y2) / 2 ))
          }

          adb shell am start -n com.pindou.app/.SplashActivity
          sleep 10
          adb shell screencap -p /sdcard/s1_home.png
          adb pull /sdcard/s1_home.png shot-home.png

          tap_text "空白画布"
          sleep 4
          adb shell screencap -p /sdcard/s2_canvas.png
          adb pull /sdcard/s2_canvas.png shot-canvas.png

          # 画笔模式默认开启:画两笔
          adb shell input swipe 300 900 600 1100 300
          adb shell input swipe 500 800 700 1200 300
          sleep 2
          adb shell screencap -p /sdcard/s3_painted.png
          adb pull /sdcard/s3_painted.png shot-painted.png

          adb shell screencap -p /sdcard/s4.png
          adb pull /sdcard/s4.png shot-final.png

          echo "--- crash check ---"
          if adb logcat -d | grep -q "FATAL EXCEPTION"; then
            adb logcat -d | grep -A 30 "FATAL EXCEPTION" | head -60
            echo "APP CRASHED"
            exit 1
          fi
          echo "no fatal exceptions"

      - name: Upload smoke screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screens
          path: shot-*.png
          retention-days: 14
