name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: CIEDE2000 reference test (Sharma 2005, 34 pairs)
        run: |
          mkdir -p qa/out
          javac -sourcepath app/src/main/java -d qa/out qa/TestColorMath.java
          java -cp qa/out TestColorMath

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.6

      - name: Build debug APK (compile check)
        run: gradle -p . assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PindouPhoto-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
