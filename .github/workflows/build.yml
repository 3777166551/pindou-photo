name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run qa test suite (ColorMath / PatternEngine / PatternPatch)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager --install "platforms;android-34" > /dev/null
          bash qa/run_tests.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build debug APK (compile check)
        run: gradle -p . assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PindouPhoto-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  emulator-smoke:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 40
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android-avd
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: PindouPhoto-debug
          path: apk

      - name: Install emulator and system image
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "emulator" \
            "system-images;android-30;google_apis;x86_64" > /dev/null
          echo no | avdmanager create avd -n smoke \
            -k "system-images;android-30;google_apis;x86_64" --device pixel_4
          ls -la "$ANDROID_AVD_HOME"

      - name: Start headless emulator
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ACCEL="-accel on"
            echo "KVM available (permission granted)"
          else
            ACCEL="-no-accel"
            echo "KVM missing, software emulation"
          fi
          emulator -avd smoke -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect $ACCEL -camera-back none -camera-front none &
          for i in $(seq 1 90); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then echo "boot completed after ${i}0s"; break; fi
            sleep 10
          done
          [ "$BOOT" = "1" ] || { echo "emulator boot timeout"; exit 1; }

      - name: Install debug APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb wait-for-device
          adb install -r apk/*.apk
          # 关动画,避免时序抖动
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Extended UI smoke (click-through)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          bash qa/ui_smoke.sh

      - name: Upload smoke screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screens
          path: shots/*
          retention-days: 14
