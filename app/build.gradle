plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pindou.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.pindou.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// 本工程零第三方依赖,纯 Android 框架 API
dependencies {
}
