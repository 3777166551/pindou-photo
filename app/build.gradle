plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pindou.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.pindou.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        // 仅 64 位:ONNX 原生库只打包 arm64-v8a,与商店"仅支持 64 位设备"
        // 的声明一致(32 位设备被商店过滤;本地 bat 构建本就只带 arm64 so)
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// 唯一第三方依赖:ONNX Runtime(MIT 许可,用于 U²-Net 抠图与 AnimeGANv3 风格化,
// 见 THIRD_PARTY.md)。本地原生构建(build_apk.bat)则使用 tools/ort_aar 等价物。
dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.1'
}
